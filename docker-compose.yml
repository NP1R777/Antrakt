# Local development only. Production uses docker-compose.prod.yml.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: antrakt_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123"
    ports:
      - "127.0.0.1:${DEV_DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d antrakt_db"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    # Preserve the storage version; never upgrade existing data implicitly.
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:${DEV_S3_PORT:-9000}:9000"
      - "127.0.0.1:${DEV_S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "--noproxy", "*", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${DEV_API_PORT:-8000}:8000"
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      DATABASE_NAME: antrakt_db
      DATABASE_USER: postgres
      DATABASE_PASSWORD: "123"
      MINIO_ENDPOINT: http://minio:9000
      MINIO_CUSTOM_DOMAIN: localhost:${DEV_S3_PORT:-9000}/antrakt-images
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      MINIO_BUCKET_NAME: antrakt-images
      FRONTEND_BASE_URL: http://localhost:${DEV_WEB_PORT:-3000}
      PERFORMANCE_RELATIONS_ENABLED: "False"
      TRUSTED_PROXY_COUNT: "0"
      VK_IMPORT_BACKEND: ${VK_IMPORT_BACKEND:-auto}
      VK_GROUP_DOMAIN: ${VK_GROUP_DOMAIN:-tc_antrakt}
      VK_ACCESS_TOKEN: ${VK_ACCESS_TOKEN:-}
      VK_SESSION_COOKIE: ${VK_SESSION_COOKIE:-}
      VK_IMPORT_INTERVAL_SECONDS: ${VK_IMPORT_INTERVAL_SECONDS:-1209600}
      DEBUG: "True"
      REPOSITORY_FIXTURE_ROOT: /development-fixtures
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./backend/app:/app
      - ./database:/development-fixtures/database:ro
      - ./backend/database:/development-fixtures/backend/database:ro
    healthcheck:
      test: ["CMD", "curl", "--noproxy", "*", "-f", "http://127.0.0.1:8000/health/"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  # Для разработки интеграции: docker compose --profile vk up -d vk-reviews-worker
  vk-reviews-worker:
    profiles: ["vk"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      DATABASE_NAME: antrakt_db
      DATABASE_USER: postgres
      DATABASE_PASSWORD: "123"
      USE_MINIO_STORAGE: "False"
      VK_IMPORT_BACKEND: ${VK_IMPORT_BACKEND:-auto}
      VK_GROUP_DOMAIN: ${VK_GROUP_DOMAIN:-tc_antrakt}
      VK_ACCESS_TOKEN: ${VK_ACCESS_TOKEN:-}
      VK_SESSION_COOKIE: ${VK_SESSION_COOKIE:-}
      VK_IMPORT_INTERVAL_SECONDS: ${VK_IMPORT_INTERVAL_SECONDS:-1209600}
    volumes:
      - ./backend/app:/app
    depends_on:
      backend:
        condition: service_healthy
    command: ["python", "manage.py", "vk_reviews_worker"]
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend/antrakt
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${DEV_WEB_PORT:-3000}:3000"
    environment:
      REACT_APP_API_URL: http://localhost:${DEV_API_PORT:-8000}
      REACT_APP_MEDIA_URL: http://localhost:${DEV_S3_PORT:-9000}
      BROWSER: none
      HOST: 0.0.0.0
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./frontend/antrakt/src:/app/src
      - ./frontend/antrakt/public:/app/public
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

# Names are scoped to the Compose project; no global container/volume names.
volumes:
  postgres_data:
  minio_data:
