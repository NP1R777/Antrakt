server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Backend получает исходную сборку по точному адресу, без повторного proxy.
    location = /index.html {
        add_header Cache-Control "no-store";
        try_files /index.html =503;
    }

    # Один HTML для всех User-Agent: сервер вставляет метаданные перед запуском React.
    location / {
        proxy_pass http://backend:8000/public-page/;
        proxy_set_header Host backend;
        # В production внешний HTTPS завершает Caddy.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_hide_header Set-Cookie;
        proxy_intercept_errors off;
    }

    # Иконки сайта не кэшируем надолго — иначе после деплоя остаётся старый React favicon.
    location ~* ^/(favicon\.ico|favicon-[0-9]+\.png|logo192\.png|logo512\.png|manifest\.json)$ {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # Долгое кэширование статических ассетов (у них хэш в имени).
    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
